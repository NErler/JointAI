on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    if: "! contains(toJSON(github.event.commits.*.message), '[skip-check]')"

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          # runs the slow tests too (JOINTAI_SLOW_TESTS, tests/testthat/helper-slow.R)
          - {os: ubuntu-latest,  r: 'release', slow-tests: 'true'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      JOINTAI_SLOW_TESTS: ${{ matrix.config.slow-tests || 'false' }}


    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true


      # JAGS 5 (rjags >= 5-0 requires it); local action in .github/actions
      - uses: ./.github/actions/install-jags


      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::survival
            any::rcmdcheck
          cache-version: 2
          needs: check


      # install.packages() only warns if the installation fails; loading rjags
      # makes the step fail if rjags cannot find JAGS
      - name: Install rjags
        run: Rscript -e 'install.packages("rjags", type = "source"); library(rjags)'


      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
