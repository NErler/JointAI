on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    if: "! contains(toJSON(github.event.commits.*.message), '[skip-check]')"

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          # runs the slow tests too (JOINTAI_SLOW_TESTS, tests/testthat/helper-slow.R)
          - {os: ubuntu-latest,  r: 'release', slow-tests: 'true'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      JOINTAI_SLOW_TESTS: ${{ matrix.config.slow-tests || 'false' }}


    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true


      # Official JAGS installer: puts libjags in /usr/local/lib, where the CRAN
      # binary of rjags looks for it (Homebrew uses /opt/homebrew on arm64)
      - name: Install JAGS (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sSL -o jags.pkg "https://sourceforge.net/projects/mcmc-jags/files/JAGS/4.x/Mac%20OS%20X/JAGS-4.3.2.pkg/download"
          sudo installer -pkg jags.pkg -target /
          rm jags.pkg

      # Cache JAGS installation (Windows)
      - name: Cache JAGS (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: C:\Program Files\JAGS
          key: ${{ runner.os }}-jags-4.3.1
          restore-keys: |
            ${{ runner.os }}-jags-

      # Install JAGS on Windows
      - name: Install JAGS (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist "C:\Program Files\JAGS\JAGS-4.3.1\bin\jags-terminal.exe" (
            echo "JAGS not found in cache, downloading and installing..."
            curl -o jags-installer.exe -L https://sourceforge.net/projects/mcmc-jags/files/JAGS/4.x/Windows/JAGS-4.3.1.exe/download
            jags-installer.exe /S
            del jags-installer.exe
          ) else (
            echo "JAGS found in cache, skipping installation"
          )


      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::survival
            any::rcmdcheck
          cache-version: 2
          needs: check


      # install.packages() only warns if the installation fails; loading rjags
      # makes the step fail if rjags cannot find JAGS
      - name: Install rjags
        run: Rscript -e 'install.packages("rjags", type = "source"); library(rjags)'


      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
